<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" style="background:#0a0d14;font-family:'Roboto', sans-serif;">
  <defs>
    <!-- Neon gradient for strokes -->
    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#00eaff" />
      <stop offset="100%" stop-color="#2bff88" />
    </linearGradient>

    <!-- Background subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#1f2733" stroke-width="1" />
    </pattern>

    <!-- Glow filter for neon effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="50%" y="60" text-anchor="middle" fill="url(#neonStroke)" font-size="40" font-weight="bold" filter="url(#glow)">
    周年庆·科技打卡地图
  </text>

  <!-- Connecting lines -->
  <g stroke="url(#neonStroke)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10" filter="url(#glow)">
    <line x1="200" y1="150" x2="800" y2="150" />
    <line x1="800" y1="150" x2="500" y2="350" />
    <line x1="500" y1="350" x2="800" y2="550" />
    <line x1="500" y1="350" x2="200" y2="550" />
    <line x1="200" y1="550" x2="200" y2="150" />
  </g>

  <!-- Nodes / Stamp placeholders -->
  <g stroke="url(#neonStroke)" stroke-width="4" fill="none" filter="url(#glow)">
    <!-- 1. 粘币游戏 -->
    <circle cx="200" cy="150" r="60" />
    <circle cx="200" cy="150" r="40" stroke-dasharray="6 8" />
    <!-- 2. 淘趣循环市集 -->
    <circle cx="800" cy="150" r="60" />
    <circle cx="800" cy="150" r="40" stroke-dasharray="6 8" />
    <!-- 3. 框住时光·与你同行 -->
    <circle cx="500" cy="350" r="60" />
    <circle cx="500" cy="350" r="40" stroke-dasharray="6 8" />
    <!-- 4. 快问快答 -->
    <circle cx="200" cy="550" r="60" />
    <circle cx="200" cy="550" r="40" stroke-dasharray="6 8" />
    <!-- 5. 量子纠缠瓶 -->
    <circle cx="800" cy="550" r="60" />
    <circle cx="800" cy="550" r="40" stroke-dasharray="6 8" />
  </g>

  <!-- Labels -->
  <g fill="#ffffff" font-size="18" text-anchor="middle" dominant-baseline="middle">
    <text x="200" y="150">粘币游戏</text>
    <text x="800" y="150">淘趣循环市集</text>
    <text x="500" y="350">框住时光·与你同行</text>
    <text x="200" y="550">快问快答</text>
    <text x="800" y="550">量子纠缠瓶</text>
  </g>

  <!-- Instruction note -->
  <text x="50%" y="680" text-anchor="middle" fill="#888" font-size="14">※ 在每个圆形虚线区域内盖章</text>
</svg>