<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Neon glow filter -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit line pattern for subtle tech texture -->
    <pattern id="circuit" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none"/>
      <path d="M10 0 V200 M0 10 H200" stroke="#1e3a5f" stroke-width="1" opacity="0.2"/>
      <path d="M0 100 H200 M100 0 V200" stroke="#1e3a5f" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#circuit)"/>

  <!-- Title -->
  <text x="960" y="120" text-anchor="middle" font-size="64" fill="#64ffda" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" filter="url(#neon)" letter-spacing="4">
    周年庆科技打卡地图
  </text>

  <!-- Stamp placeholders coordinates -->
  <!-- We'll arrange five circles horizontally -->
  <!-- Positions: (x, y) pairs -->
  <!-- 1: 320, 400; 2: 640, 400; 3: 960, 400; 4: 1280, 400; 5: 1600, 400 -->
  <g id="locations" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="28" fill="#f0faff">
    <!-- Location 1 -->
    <g transform="translate(320,400)">
      <circle r="90" fill="none" stroke="#64ffda" stroke-width="4" filter="url(#neon)"/>
      <!-- Inner dashed circle as stamp area -->
      <circle r="70" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="10 10" opacity="0.5"/>
      <text y="140" text-anchor="middle">粘币游戏</text>
    </g>

    <!-- Location 2 -->
    <g transform="translate(640,400)">
      <circle r="90" fill="none" stroke="#64ffda" stroke-width="4" filter="url(#neon)"/>
      <circle r="70" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="10 10" opacity="0.5"/>
      <text y="140" text-anchor="middle">淘趣循环市集</text>
    </g>

    <!-- Location 3 -->
    <g transform="translate(960,400)">
      <circle r="90" fill="none" stroke="#64ffda" stroke-width="4" filter="url(#neon)"/>
      <circle r="70" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="10 10" opacity="0.5"/>
      <text y="140" text-anchor="middle">框住时光·与你同行</text>
    </g>

    <!-- Location 4 -->
    <g transform="translate(1280,400)">
      <circle r="90" fill="none" stroke="#64ffda" stroke-width="4" filter="url(#neon)"/>
      <circle r="70" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="10 10" opacity="0.5"/>
      <text y="140" text-anchor="middle">快问快答</text>
    </g>

    <!-- Location 5 -->
    <g transform="translate(1600,400)">
      <circle r="90" fill="none" stroke="#64ffda" stroke-width="4" filter="url(#neon)"/>
      <circle r="70" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="10 10" opacity="0.5"/>
      <text y="140" text-anchor="middle">量子纠缠瓶</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="960" y="1000" text-anchor="middle" font-size="24" fill="#85a9ff" opacity="0.8">
    请在完成每个任务后在对应圆圈内盖章！
  </text>
</svg>