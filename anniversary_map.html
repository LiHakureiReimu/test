<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周年庆打卡地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-container {
            position: relative;
            width: 90vw;
            height: 80vh;
            max-width: 1200px;
            max-height: 800px;
            border: 2px solid #00ffff;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, rgba(0, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.3) 70%);
            box-shadow: 
                0 0 50px rgba(0, 255, 255, 0.3),
                inset 0 0 50px rgba(0, 255, 255, 0.1);
            animation: mapGlow 3s ease-in-out infinite alternate;
        }

        @keyframes mapGlow {
            0% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.3), inset 0 0 50px rgba(0, 255, 255, 0.1); }
            100% { box-shadow: 0 0 80px rgba(0, 255, 255, 0.5), inset 0 0 80px rgba(0, 255, 255, 0.2); }
        }

        .title {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .checkpoint {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 3px solid #00ffff;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, rgba(0, 0, 0, 0.8) 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        .checkpoint:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            border-color: #ff00ff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .checkpoint-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 5px;
        }

        .checkpoint-name {
            font-size: 0.8em;
            text-align: center;
            color: #fff;
            line-height: 1.2;
        }

        /* 打卡点位置 */
        .checkpoint-1 { top: 15%; left: 20%; }
        .checkpoint-2 { top: 25%; right: 15%; }
        .checkpoint-3 { top: 50%; left: 10%; }
        .checkpoint-4 { bottom: 25%; right: 20%; }
        .checkpoint-5 { bottom: 15%; left: 35%; }

        /* 连接线 */
        .connection-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            opacity: 0.6;
            animation: lineFlow 3s ease-in-out infinite;
        }

        @keyframes lineFlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .line-1-2 {
            top: 22%;
            left: 28%;
            width: 45%;
            transform: rotate(5deg);
        }

        .line-2-4 {
            top: 35%;
            right: 18%;
            width: 35%;
            transform: rotate(45deg);
        }

        .line-1-3 {
            top: 30%;
            left: 15%;
            width: 30%;
            transform: rotate(70deg);
        }

        .line-3-5 {
            bottom: 32%;
            left: 22%;
            width: 25%;
            transform: rotate(-20deg);
        }

        .line-4-5 {
            bottom: 20%;
            left: 43%;
            width: 35%;
            transform: rotate(0deg);
        }

        /* 盖章区域 */
        .stamp-area {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px dashed #ffff00;
            border-radius: 10px;
            background: rgba(255, 255, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: stampGlow 2s ease-in-out infinite alternate;
        }

        @keyframes stampGlow {
            0% { box-shadow: 0 0 10px rgba(255, 255, 0, 0.3); }
            100% { box-shadow: 0 0 25px rgba(255, 255, 0, 0.6); }
        }

        .stamp-text {
            font-size: 0.7em;
            color: #ffff00;
            text-align: center;
            font-weight: bold;
        }

        .stamp-1 { top: 10%; right: 25%; }
        .stamp-2 { top: 40%; right: 5%; }
        .stamp-3 { top: 65%; left: 5%; }
        .stamp-4 { bottom: 10%; right: 10%; }
        .stamp-5 { bottom: 5%; left: 50%; }

        /* 科技网格背景 */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            border-radius: 18px;
        }

        /* 粒子效果 */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        .particle:nth-child(1) { top: 20%; left: 30%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 60%; left: 70%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 80%; left: 20%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 40%; left: 80%; animation-delay: 3s; }
        .particle:nth-child(5) { top: 30%; left: 60%; animation-delay: 4s; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .title { font-size: 2em; top: -50px; }
            .checkpoint { width: 80px; height: 80px; }
            .checkpoint-number { font-size: 1.2em; }
            .checkpoint-name { font-size: 0.7em; }
            .stamp-area { width: 70px; height: 70px; }
            .stamp-text { font-size: 0.6em; }
        }

        /* 完成状态 */
        .checkpoint.completed {
            border-color: #00ff00;
            background: radial-gradient(circle, rgba(0, 255, 0, 0.3) 0%, rgba(0, 0, 0, 0.8) 70%);
        }

        .checkpoint.completed .checkpoint-number {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="map-container">
            <h1 class="title">周年庆打卡地图</h1>
            
            <!-- 科技网格背景 -->
            <div class="grid-overlay"></div>
            
            <!-- 粒子效果 -->
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            
            <!-- 连接线 -->
            <div class="connection-line line-1-2"></div>
            <div class="connection-line line-2-4"></div>
            <div class="connection-line line-1-3"></div>
            <div class="connection-line line-3-5"></div>
            <div class="connection-line line-4-5"></div>
            
            <!-- 打卡点 -->
            <div class="checkpoint checkpoint-1" data-id="1">
                <div class="checkpoint-number">1</div>
                <div class="checkpoint-name">粘币游戏</div>
            </div>
            
            <div class="checkpoint checkpoint-2" data-id="2">
                <div class="checkpoint-number">2</div>
                <div class="checkpoint-name">淘趣循环<br>市集</div>
            </div>
            
            <div class="checkpoint checkpoint-3" data-id="3">
                <div class="checkpoint-number">3</div>
                <div class="checkpoint-name">框住时光·<br>与你同行</div>
            </div>
            
            <div class="checkpoint checkpoint-4" data-id="4">
                <div class="checkpoint-number">4</div>
                <div class="checkpoint-name">快问快答</div>
            </div>
            
            <div class="checkpoint checkpoint-5" data-id="5">
                <div class="checkpoint-number">5</div>
                <div class="checkpoint-name">量子纠缠瓶</div>
            </div>
            
            <!-- 盖章区域 -->
            <div class="stamp-area stamp-1">
                <div class="stamp-text">盖章区域<br>1</div>
            </div>
            
            <div class="stamp-area stamp-2">
                <div class="stamp-text">盖章区域<br>2</div>
            </div>
            
            <div class="stamp-area stamp-3">
                <div class="stamp-text">盖章区域<br>3</div>
            </div>
            
            <div class="stamp-area stamp-4">
                <div class="stamp-text">盖章区域<br>4</div>
            </div>
            
            <div class="stamp-area stamp-5">
                <div class="stamp-text">盖章区域<br>5</div>
            </div>
        </div>
    </div>

    <script>
        // 添加交互功能
        document.addEventListener('DOMContentLoaded', function() {
            const checkpoints = document.querySelectorAll('.checkpoint');
            
            checkpoints.forEach(checkpoint => {
                checkpoint.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const name = this.querySelector('.checkpoint-name').textContent;
                    
                    // 切换完成状态
                    this.classList.toggle('completed');
                    
                    // 显示提示信息
                    if (this.classList.contains('completed')) {
                        showNotification(`已完成打卡: ${name}`);
                    } else {
                        showNotification(`取消打卡: ${name}`);
                    }
                });
                
                // 鼠标悬停效果
                checkpoint.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.1) rotate(5deg)';
                });
                
                checkpoint.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1) rotate(0deg)';
                });
            });
        });
        
        // 显示通知
        function showNotification(message) {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(0, 255, 255, 0.9);
                color: #000;
                padding: 15px 25px;
                border-radius: 10px;
                font-weight: bold;
                z-index: 1000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            `;
            
            document.body.appendChild(notification);
            
            // 3秒后自动移除
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }
        
        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
